<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Importación</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="contenedor">
    <h1>🚗 Calculadora de Importación</h1>
    <p class="subtitulo">Calcula el costo aproximado de importar tu vehículo</p>

    <div class="formulario">
        <label for="precio">Precio del vehículo (USD)</label>
        <input type="number" id="precio" placeholder="Ejemplo: 10000" min="0" step="0.01">

        <label for="tipoCambio">Tipo de cambio</label>
        <input type="number" id="tipoCambio" value="7.80" min="0" step="0.01">

        <label for="impuesto">Impuesto (%)</label>
        <input type="number" id="impuesto" value="32" min="0" step="0.01">

        <button onclick="calcular()">CALCULAR</button>
        <button class="limpiar" onclick="limpiar()">LIMPIAR</button>
    </div>

    <div class="resultado">
        <h2>📋 Resultado</h2>
        <div class="fila"><span>Precio del vehículo:</span><strong id="precioOriginal">Q0.00</strong></div>
        <div class="fila"><span>Precio convertido:</span><strong id="precioConvertido">Q0.00</strong></div>
        <div class="fila"><span>Impuesto:</span><strong id="totalImpuesto">Q0.00</strong></div>
        <div class="fila"><span>Fees:</span><strong>Q500.00</strong></div>
        <div class="fila"><span>Edson:</span><strong>Q200.00</strong></div>
        <div class="fila"><span>Pago fijo:</span><strong>Q16,918.16</strong></div>
        <hr>
        <div class="total"><span>TOTAL IMPORTACIÓN:</span><strong id="total">Q0.00</strong></div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
